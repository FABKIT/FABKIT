name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Pull the-fab-cube card data
        uses: actions/checkout@v7
        with:
          repository: the-fab-cube/flesh-and-blood-cards
          ref: develop
          path: ".fab-cube"
          sparse-checkout: json/english

      - name: Build pack data
        env:
          FAB_CUBE_DIR: .fab-cube
        run: bun run build-pack-data

      - name: Test
        run: bun test tests/

      - name: Build
        run: bun run build
